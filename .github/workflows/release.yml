name: Release Standalone Windows & Linux Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Installer & Archive
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller verifyarr.spec --noconfirm --clean

      - name: Stage distribution directory and batch scripts
        shell: pwsh
        run: |
          $distDir = "dist/verifyarr"
          New-Item -ItemType Directory -Force -Path "$distDir/scripts/windows" | Out-Null
          New-Item -ItemType Directory -Force -Path "$distDir/logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$distDir/data" | Out-Null

          # Copy example configuration and documentation into root of distribution
          Copy-Item "config.example.yaml" -Destination "$distDir/config.example.yaml" -Force
          Copy-Item "README.md" -Destination "$distDir/README.md" -Force
          Copy-Item "LICENSE" -Destination "$distDir/LICENSE" -Force

          # Copy batch scripts into both root and scripts/windows/
          Copy-Item "scripts/windows/*.bat" -Destination "$distDir/" -Force
          Copy-Item "scripts/windows/*.bat" -Destination "$distDir/scripts/windows/" -Force

      - name: Download bundled NSSM 2.24 (Win64)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $zip = "$env:TEMP\nssm-2.24.zip"
          $extract = "$env:TEMP\nssm_extracted"
          $urls = @(
            'https://github.com/kirillkovalenko/nssm/releases/download/2.24/nssm-2.24.zip',
            'https://nssm.cc/release/nssm-2.24.zip'
          )
          $downloaded = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Attempting download from $u..."
              Invoke-WebRequest -Uri $u -OutFile $zip -TimeoutSec 30
              $downloaded = $true
              break
            } catch {
              Write-Warning "Failed downloading from $u - $_"
            }
          }
          if ($downloaded) {
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            Copy-Item "$extract\nssm-2.24\win64\nssm.exe" "dist/verifyarr/nssm.exe" -Force
            Copy-Item "$extract\nssm-2.24\win64\nssm.exe" "dist/verifyarr/scripts/windows/nssm.exe" -Force
            Remove-Item $zip, $extract -Recurse -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "Downloading NSSM via Chocolatey fallback..."
            choco install nssm --no-progress -y
            $realNssm = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter "nssm.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*win64*" } | Select-Object -First 1
            if (-not $realNssm) {
              $realNssm = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter "nssm.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if ($realNssm -and (Get-Item $realNssm.FullName).Length -gt 100000) {
              Copy-Item $realNssm.FullName "dist/verifyarr/nssm.exe" -Force
              Copy-Item $realNssm.FullName "dist/verifyarr/scripts/windows/nssm.exe" -Force
            } else {
              throw "Could not locate real nssm.exe binary from Chocolatey"
            }
          }

      - name: Create Verifyarr-windows-x64.zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/verifyarr/*" -DestinationPath "Verifyarr-windows-x64.zip" -Force

      - name: Compile Inno Setup 1-Click Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress -y
          }
          $tagVersion = "${{ github.ref_name }}"
          if ($tagVersion -like "v*") { $tagVersion = $tagVersion.Substring(1) }
          if (-not $tagVersion) { $tagVersion = "1.3.0" }
          & $iscc "/DAppVersion=$tagVersion" installer/verifyarr.iss
          if (Test-Path "dist/Verifyarr-windows-x64-Setup.exe") {
            Copy-Item "dist/Verifyarr-windows-x64-Setup.exe" "." -Force
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            Verifyarr-windows-x64-Setup.exe
            Verifyarr-windows-x64.zip

  build-linux:
    name: Build Linux x64 Portable Tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller verifyarr.spec --noconfirm --clean

      - name: Stage distribution directory
        run: |
          mkdir -p dist/verifyarr/scripts/systemd dist/verifyarr/logs dist/verifyarr/data
          cp config.example.yaml dist/verifyarr/
          cp README.md dist/verifyarr/
          cp LICENSE dist/verifyarr/
          cp scripts/systemd/verifyarr.service dist/verifyarr/scripts/systemd/
          chmod +x dist/verifyarr/verifyarr

      - name: Create Verifyarr-linux-x64.tar.gz archive
        run: |
          tar -czvf Verifyarr-linux-x64.tar.gz -C dist verifyarr

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: Verifyarr-linux-x64.tar.gz

  release:
    name: Publish Release Assets to GitHub
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Verifyarr-windows-x64-Setup.exe
            release-assets/Verifyarr-windows-x64.zip
            release-assets/Verifyarr-linux-x64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
