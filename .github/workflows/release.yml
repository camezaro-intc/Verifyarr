name: Release Standalone Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Standalone Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller verifyarr.spec --noconfirm --clean

      - name: Stage distribution directory and batch scripts
        shell: pwsh
        run: |
          $distDir = "dist/verifyarr"
          New-Item -ItemType Directory -Force -Path "$distDir/scripts/windows" | Out-Null
          New-Item -ItemType Directory -Force -Path "$distDir/logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$distDir/data" | Out-Null

          # Copy example configuration and documentation into root of distribution
          Copy-Item "config.example.yaml" -Destination "$distDir/config.example.yaml" -Force
          Copy-Item "README.md" -Destination "$distDir/README.md" -Force
          Copy-Item "LICENSE" -Destination "$distDir/LICENSE" -Force

          # Copy batch scripts into both root (for convenience) and scripts/windows/
          Copy-Item "scripts/windows/*.bat" -Destination "$distDir/" -Force
          Copy-Item "scripts/windows/*.bat" -Destination "$distDir/scripts/windows/" -Force

      - name: Create Verifyarr-windows-x64.zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/verifyarr/*" -DestinationPath "Verifyarr-windows-x64.zip" -Force

      - name: Upload artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: Verifyarr-windows-x64
          path: Verifyarr-windows-x64.zip

      - name: Upload Verifyarr-windows-x64.zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Verifyarr-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

