# Tool configuration only; Verifyarr is run from source / Docker, not published to PyPI.

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ASYNC",  # blocking calls inside async functions
]

# Our `timeout` parameters are forwarded to subprocess helpers, not a missing asyncio.timeout.
ignore = ["ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
